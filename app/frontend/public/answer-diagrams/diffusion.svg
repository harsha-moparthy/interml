<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="title desc"><title id="title">Latent diffusion: learn to reverse noise in compressed space</title><desc id="desc">Latent diffusion: learn to reverse noise in compressed space. Original educational diagram; schematic, not measured data.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#365d87"/></marker></defs><rect width="800" height="300" rx="16" fill="#f4f8fc"/><g font-family="sans-serif" fill="#172b45" font-size="17"><text x="30" y="35" font-size="21" font-weight="bold">Latent diffusion: learn to reverse noise in compressed space</text><rect x="25" y="100" width="130" height="55" rx="8" fill="#e1edfa" stroke="#6685a6"/><text x="90.0" y="133" text-anchor="middle">Image</text><path d="M155 127L190 127" stroke="#365d87" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="195" y="100" width="140" height="55" rx="8" fill="#e1edfa" stroke="#6685a6"/><text x="265.0" y="133" text-anchor="middle">Encoder</text><path d="M335 127L370 127" stroke="#365d87" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="375" y="100" width="150" height="55" rx="8" fill="#e1edfa" stroke="#6685a6"/><text x="450.0" y="133" text-anchor="middle">Latent z₀</text><path d="M525 127L560 127" stroke="#365d87" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="565" y="100" width="210" height="55" rx="8" fill="#e1edfa" stroke="#6685a6"/><text x="670.0" y="133" text-anchor="middle">Add noise → zₜ</text><rect x="365" y="210" width="170" height="55" rx="8" fill="#dcefe8" stroke="#6685a6"/><text x="450.0" y="243" text-anchor="middle">Denoise steps</text><path d="M670 155L535 232" stroke="#365d87" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M365 237L330 237" stroke="#365d87" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="170" y="210" width="155" height="55" rx="8" fill="#e1edfa" stroke="#6685a6"/><text x="247.5" y="243" text-anchor="middle">Decoder</text><path d="M170 237L150 237" stroke="#365d87" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="25" y="210" width="120" height="55" rx="8" fill="#e1edfa" stroke="#6685a6"/><text x="85.0" y="243" text-anchor="middle">New image</text><text x="30" y="80">Training: encode real images and corrupt their latents.</text><text x="30" y="188">Generation starts from noise; denoising is conditioned on text or other inputs.</text></g></svg>
