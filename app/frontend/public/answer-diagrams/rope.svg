<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="title desc"><title id="title">RoPE: relative position becomes an angle difference</title><desc id="desc">RoPE: relative position becomes an angle difference. Original educational diagram; schematic, not measured data.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#365d87"/></marker></defs><rect width="800" height="300" rx="16" fill="#f4f8fc"/><g font-family="sans-serif" fill="#172b45" font-size="17"><text x="30" y="35" font-size="21" font-weight="bold">RoPE: relative position becomes an angle difference</text><path d="M110 235L280 235" stroke="#365d87" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M110 235L110 65" stroke="#365d87" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M110 235L245 145" stroke="#365d87" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M110 235L185 90" stroke="#365d87" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="252" y="150">query at m</text><text x="195" y="88">key at n</text><path d="M166 198 Q163 174 143 171" fill="none" stroke="#d1812a" stroke-width="3"/><text x="395" y="115">Rotate each pair by position × frequency.</text><text x="395" y="155">Shared rotation cancels inside the dot product.</text><text x="395" y="195">Remaining angle: (n − m) × frequency</text><text x="395" y="245">Rotation preserves each pair’s norm.</text></g></svg>
