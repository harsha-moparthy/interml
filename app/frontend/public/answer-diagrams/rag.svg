<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="title desc"><title id="title">RAG: evidence must survive each stage</title><desc id="desc">RAG: evidence must survive each stage. Original educational diagram; schematic, not measured data.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#365d87"/></marker></defs><rect width="800" height="300" rx="16" fill="#f4f8fc"/><g font-family="sans-serif" fill="#172b45" font-size="17"><text x="30" y="35" font-size="21" font-weight="bold">RAG: evidence must survive each stage</text><rect x="20" y="100" width="130" height="55" rx="8" fill="#e1edfa" stroke="#6685a6"/><text x="85.0" y="133" text-anchor="middle">Question</text><path d="M150 127L180 127" stroke="#365d87" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="185" y="100" width="165" height="55" rx="8" fill="#e1edfa" stroke="#6685a6"/><text x="267.5" y="133" text-anchor="middle">Retrieve + ACL</text><path d="M350 127L380 127" stroke="#365d87" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="385" y="100" width="165" height="55" rx="8" fill="#e1edfa" stroke="#6685a6"/><text x="467.5" y="133" text-anchor="middle">Rerank evidence</text><path d="M550 127L580 127" stroke="#365d87" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="585" y="100" width="185" height="55" rx="8" fill="#e1edfa" stroke="#6685a6"/><text x="677.5" y="133" text-anchor="middle">Generate + cite</text><text x="30" y="200">Check recall</text><text x="235" y="200">Check permissions</text><text x="450" y="200">Check support for each claim</text><text x="30" y="250">A fluent answer cannot repair evidence that was never retrieved.</text></g></svg>
