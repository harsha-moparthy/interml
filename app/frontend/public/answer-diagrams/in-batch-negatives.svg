<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">In-batch negatives: reuse the other positive items</title><desc id="desc">Original schematic. Rows are Alice, Ben, Cara; columns are Guitar, Football, Pasta. Diagonal pairs are observed positives, all six off-diagonal pairs are sampled negatives, not confirmed dislikes. Batch selection follows logged item popularity.</desc><rect width="760" height="400" rx="16" fill="#f4f8fc"/><g font-family="sans-serif" fill="#172b45" font-size="19"><text x="28" y="40" font-size="25" font-weight="bold">In-batch negatives: reuse the other positive items</text><text x="28" y="78">One batch → nine scores from one matrix multiplication</text>
