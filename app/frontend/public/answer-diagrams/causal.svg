<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="title desc"><title id="title">Causal paths: confounder, mediator, collider</title><desc id="desc">Causal paths: confounder, mediator, collider. Original educational diagram; schematic, not measured data.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#365d87"/></marker></defs><rect width="800" height="300" rx="16" fill="#f4f8fc"/><g font-family="sans-serif" fill="#172b45" font-size="17"><text x="30" y="35" font-size="21" font-weight="bold">Causal paths: confounder, mediator, collider</text><rect x="20" y="100" width="65" height="55" rx="8" fill="#e1edfa" stroke="#6685a6"/><text x="52.5" y="133" text-anchor="middle">A</text><rect x="205" y="100" width="65" height="55" rx="8" fill="#e1edfa" stroke="#6685a6"/><text x="237.5" y="133" text-anchor="middle">B</text><rect x="110" y="55" width="65" height="55" rx="8" fill="#e1edfa" stroke="#6685a6"/><text x="142.5" y="88" text-anchor="middle">C</text><path d="M110 90L80 103" stroke="#365d87" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M175 90L207 103" stroke="#365d87" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="30" y="205">Adjust C to block</text><text x="30" y="231">this backdoor path.</text><rect x="290" y="100" width="65" height="55" rx="8" fill="#e1edfa" stroke="#6685a6"/><text x="322.5" y="133" text-anchor="middle">A</text><rect x="385" y="100" width="65" height="55" rx="8" fill="#e1edfa" stroke="#6685a6"/><text x="417.5" y="133" text-anchor="middle">M</text><rect x="480" y="100" width="65" height="55" rx="8" fill="#e1edfa" stroke="#6685a6"/><text x="512.5" y="133" text-anchor="middle">B</text><path d="M355 127L380 127" stroke="#365d87" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M450 127L475 127" stroke="#365d87" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="300" y="205">M carries part of</text><text x="300" y="231">A’s effect on B.</text><rect x="560" y="100" width="65" height="55" rx="8" fill="#e1edfa" stroke="#6685a6"/><text x="592.5" y="133" text-anchor="middle">A</text><rect x="650" y="160" width="65" height="55" rx="8" fill="#e1edfa" stroke="#6685a6"/><text x="682.5" y="193" text-anchor="middle">Z</text><rect x="725" y="100" width="65" height="55" rx="8" fill="#e1edfa" stroke="#6685a6"/><text x="757.5" y="133" text-anchor="middle">B</text><path d="M605 155L650 175" stroke="#365d87" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M750 155L715 175" stroke="#365d87" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="565" y="255">Conditioning on Z</text><text x="565" y="280">opens association.</text></g></svg>
