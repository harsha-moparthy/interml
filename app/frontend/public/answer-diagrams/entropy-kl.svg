<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Cross-entropy = source uncertainty + mismatch</title><desc id="desc">Original numerical example in bits. P is 0.75, 0.25. A matching model has cross-entropy 0.8113 and KL zero. A uniform model has cross-entropy 1, consisting of entropy 0.8113 plus KL 0.1887.</desc><rect width="760" height="400" rx="16" fill="#f4f8fc"/><g font-family="sans-serif" fill="#172b45" font-size="19"><text x="28" y="40" font-size="25" font-weight="bold">Cross-entropy = source uncertainty + mismatch</text><text x="28" y="80">True weather: 75% sunshine, 25% rain</text>
<text x="28" y="126">Model Q = P</text><rect x="28" y="142" width="486.78" height="48" rx="5" fill="#167d67"/><text x="47" y="173" fill="white">Entropy: 0.8113 bits</text><text x="535" y="173">KL = 0</text>
<text x="28" y="230">Model Q = (0.5, 0.5)</text><rect x="28" y="246" width="486.78" height="48" fill="#167d67"/><rect x="514.78" y="246" width="113.22" height="48" fill="#d1812a"/><text x="47" y="277" fill="white">Same entropy: 0.8113</text><text x="571" y="277" text-anchor="middle" fill="#172b45">+ 0.1887</text>
<text x="28" y="335">Total cross-entropy: 1 bit. Only the mismatch changes.</text><text x="28" y="373">For fixed P, minimizing H(P,Q) minimizes KL(P || Q).</text></g></svg>
