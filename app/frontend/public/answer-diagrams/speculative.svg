<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="title desc"><title id="title">Speculative decoding: verify the proposal distribution</title><desc id="desc">Speculative decoding: verify the proposal distribution. Original educational diagram; schematic, not measured data.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#365d87"/></marker></defs><rect width="800" height="300" rx="16" fill="#f4f8fc"/><g font-family="sans-serif" fill="#172b45" font-size="17"><text x="30" y="35" font-size="21" font-weight="bold">Speculative decoding: verify the proposal distribution</text><rect x="20" y="90" width="160" height="55" rx="8" fill="#e1edfa" stroke="#6685a6"/><text x="100.0" y="123" text-anchor="middle">Draft token x</text><path d="M180 117L215 117" stroke="#365d87" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="220" y="90" width="290" height="55" rx="8" fill="#e1edfa" stroke="#6685a6"/><text x="365.0" y="123" text-anchor="middle">Accept: min(1, p(x) / q(x))</text><path d="M510 117L555 90" stroke="#365d87" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="560" y="63" width="210" height="55" rx="8" fill="#dcefe8" stroke="#6685a6"/><text x="665.0" y="96" text-anchor="middle">Accept x</text><path d="M510 117L555 180" stroke="#365d87" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="560" y="155" width="210" height="55" rx="8" fill="#e1edfa" stroke="#6685a6"/><text x="665.0" y="188" text-anchor="middle">Reject + resample</text><text x="25" y="220">Accepted mass: min(p, q)</text><text x="380" y="220">Residual mass: max(p − q, 0)</text><text x="25" y="265">Together they recover p. After rejection, stop verifying the old draft suffix.</text></g></svg>
